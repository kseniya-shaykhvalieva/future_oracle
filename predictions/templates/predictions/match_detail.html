{% load static %}
<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1>Прогноз на матч</h1>
    <div class="card">
        <div class="card-body">
            <h5 class="card-title">{{ match.home_team }} vs {{ match.away_team }}</h5>
            <p><strong>Прогноз:</strong> {{ prediction.prediction }}</p>
            <p><strong>Уверенность:</strong> {{ prediction.confidence }}%</p>
            <p><strong>Риск:</strong> {{ prediction.risk }}</p>
            <a href="{% url 'predictions:match_list' %}" class="btn btn-secondary">Назад</a>
        </div>
    </div>
</div>
</body>
</html>
