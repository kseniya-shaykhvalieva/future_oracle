{% load static %}
<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1>Прогнозы на матчи КХЛ</h1>
    <div class="row">
        {% for match in matches %}
        <div class="col-md-4">
            <div class="card mb-3">
                <div class="card-body">
                    <h5 class="card-title">{{ match.home_team }} vs {{ match.away_team }}</h5>
                    <a href="{% url 'predictions:match_detail' match.pk %}" class="btn btn-primary">Прогноз</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
</body>
</html>
