[project]
name = "future-oracle"
version = "0.1.0"
description = ""
authors = [
    {name = "kseniya-shaykhvalieva",email = "kseniyashajhvalieva@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "django (>=6.1,<7.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "djangorestframework (>=3.18.0,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)"
]
lint = [
    "flake8 (>=7.3.0,<8.0.0)"
]

[tool.black]
line-length = 119

[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = "venv|__pycache__"
